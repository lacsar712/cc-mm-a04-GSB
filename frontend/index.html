<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>矿井瓦斯班测台</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #1c1917; color: #f5f5f4; }
    header { display: flex; gap: 12px; align-items: center; padding: 12px 20px; background: #44403c; }
    nav button { font-weight: bold; }
    nav button.active { outline: 2px solid #fbbf24; }
    main { max-width: 760px; margin: 20px auto; padding: 0 12px; }
    input, button { padding: 8px; margin-right: 8px; }
    .alarm { color: #fca5a5; } .ok { color: #86efac; }
    #live { min-height: 1.4em; }
    table { width: 100%; border-collapse: collapse; }
    td, th { border-bottom: 1px solid #57534e; padding: 6px; text-align: left; }
    .pk { color: #fbbf24; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <strong>矿井瓦斯班测台</strong>
    <nav id="nav" hidden>
      <button id="tab-readings" class="active">总表</button>
      <button id="tab-peaks">峰值册</button>
    </nav>
    <span id="who"></span>
    <button id="out" hidden>退出</button>
  </header>
  <main>
    <section id="login">
      <p>检查员上报测点甲烷，达到 1% 会立刻推到已打开的页面。这不是图表看板。</p>
      <input id="user" value="gasman" />
      <input id="pass" type="password" value="gas123456" />
      <button id="go">登录</button>
      <p>gasman / gas123456 可上报；viewer / view123456 只能看</p>
    </section>
    <section id="app" hidden>
      <p id="live">等待推送</p>
      <form id="form">
        <input id="site" placeholder="测点" />
        <input id="ch4" type="number" step="0.01" placeholder="甲烷 %" />
        <button>上报</button>
      </form>

      <section id="view-readings">
        <table>
          <thead><tr><th>班测主键</th><th>测点</th><th>甲烷 %</th><th>状态</th><th>说明</th><th id="th-correct">改正浓度</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </section>

      <section id="view-peaks" hidden>
        <p>每个测点本班次只保留最高值，只升不降；改正历史浓度后由系统按现存全部班测重算。</p>
        <table>
          <thead><tr><th>测点</th><th>当前峰值 %</th><th>对应班测主键</th></tr></thead>
          <tbody id="peaks"></tbody>
        </table>
      </section>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
